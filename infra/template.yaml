AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AgroCentinela MVP — Infra base (T-1.3)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref AgroCentinelaTable
        QUEUE_URL: !GetAtt ClimateIngestaQueue.QueueUrl
        IMAGES_BUCKET: !Ref DiagnosisImagesBucket

Resources:
  # ─── DynamoDB Single-Table ─────────────────────────────────────────
  AgroCentinelaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub AgroCentinela-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # ─── SQS Queue para fan-out de ingesta climática ────────────────────
  ClimateIngestaQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrocentinela-climate-ingesta-${Environment}
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ClimateIngestaDLQ.Arn
        maxReceiveCount: 3

  ClimateIngestaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub agrocentinela-climate-ingesta-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  # ─── S3 Bucket para imágenes de diagnóstico ─────────────────────────
  DiagnosisImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub agrocentinela-diagnosis-images-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # ─── EventBridge Rule (cron diario, deshabilitada hasta D2) ─────────
  ClimateIngestaScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub agrocentinela-climate-daily-${Environment}
      Description: Dispara ingesta climática diaria (06:00 UTC = 03:00 ART)
      ScheduleExpression: cron(0 6 * * ? *)
      State: DISABLED
      Targets:
        - Id: ClimateSchedulerTarget
          Arn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:agrocentinela-climate-scheduler-${Environment}
          Input: '{}'

  # Se habilita cuando exista la función (T-1.2).
  # ClimateSchedulerInvokePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !Sub agrocentinela-climate-scheduler-${Environment}
  #     Action: lambda:InvokeFunction
  #     Principal: events.amazonaws.com
  #     SourceArn: !GetAtt ClimateIngestaScheduleRule.Arn

  # ─── SSM Parameters (placeholders para config) ─────────────────────
  ParamTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /agrocentinela/${Environment}/table-name
      Type: String
      Value: !Ref AgroCentinelaTable

  ParamQueueUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /agrocentinela/${Environment}/climate-queue-url
      Type: String
      Value: !GetAtt ClimateIngestaQueue.QueueUrl

  ParamImagesBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /agrocentinela/${Environment}/images-bucket
      Type: String
      Value: !Ref DiagnosisImagesBucket

Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref AgroCentinelaTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt AgroCentinelaTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TableArn

  QueueUrl:
    Description: SQS queue URL for climate ingesta
    Value: !GetAtt ClimateIngestaQueue.QueueUrl
    Export:
      Name: !Sub ${AWS::StackName}-QueueUrl

  QueueArn:
    Description: SQS queue ARN for climate ingesta
    Value: !GetAtt ClimateIngestaQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-QueueArn

  ImagesBucketName:
    Description: S3 bucket for diagnosis images
    Value: !Ref DiagnosisImagesBucket
    Export:
      Name: !Sub ${AWS::StackName}-ImagesBucket

  ImagesBucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt DiagnosisImagesBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ImagesBucketArn

  EventRuleArn:
    Description: EventBridge rule ARN (disabled until D2)
    Value: !GetAtt ClimateIngestaScheduleRule.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EventRuleArn
